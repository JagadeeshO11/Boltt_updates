name: APSRTC Connect Android APK

on:
  push:
    paths:
      - 'APSRTC-Connect/**'
      - '.github/workflows/apsrtc-connect-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: APSRTC-Connect
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APSRTC-Connect-debug
          path: APSRTC-Connect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
